<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ead8" />
    <title>Defend the Heart</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 29 C4 20 2 12 6 7 C10 3 15 5 16 9 C17 5 22 3 26 7 C30 12 28 20 16 29Z' fill='%23c8554e' stroke='%232a1e18' stroke-width='1.6'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header id="hud" aria-label="Status">
        <div class="brand"><h1>Defend the Heart</h1><span>Level one</span></div>
        <dl class="stats">
          <div class="stat"><dt>Heart health</dt><dd><span id="hp"></span><span class="bar"><i id="hpbar"></i></span></dd></div>
          <div class="stat"><dt>Wave</dt><dd id="wave"></dd></div>
          <div class="stat"><dt>Energy</dt><dd id="energy"></dd></div>
          <div class="stat"><dt>White cells</dt><dd id="cells"></dd></div>
          <div class="stat"><dt>Immune pulse</dt><dd id="pulseStat"></dd></div>
        </dl>
        <div class="hud-buttons">
          <button id="btnPause" type="button" title="Pause (P)">Pause</button>
          <button id="btnSpeed" type="button">Speed ×1</button>
          <button id="btnRestart" type="button" class="danger">Restart</button>
        </div>
      </header>
      <main id="layout">
        <section id="field" aria-label="The heart and its two vessels">
          <canvas id="board" aria-label="Map: the heart in the centre with four vessels approaching it; sites beside each vessel for lymph nodes."></canvas>
          <div id="toast" aria-live="polite"></div>
          <div id="popover" class="popover" hidden></div>
          <div id="overlay" hidden></div>
        </section>
        <aside id="panel" aria-label="Controls"></aside>
      </main>
      <footer id="foot">Also here: <a href="./goosebridge.html">The Last Ward: Siege of Goosebridge</a> · <a href="./styles.html">art style studies</a></footer>
    </div>
    <script type="module" src="/src/anatomy/main.ts"></script>
  </body>
</html>
