<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f2e9d4" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Defend the Heart" />
    <title>Defend the Heart</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 29 C4 20 2 12 6 7 C10 3 15 5 16 9 C17 5 22 3 26 7 C30 12 28 20 16 29Z' fill='%23c8554e' stroke='%232a1e18' stroke-width='1.6'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header id="hud" aria-label="Status">
        <div class="brand"><h1 id="title">Defend the Heart</h1><span id="levelName">Level 1</span></div>
        <dl class="stats">
          <div class="stat"><dt id="hpLabel">Heart health</dt><dd><span id="hp"></span><span class="bar"><i id="hpbar"></i></span></dd></div>
          <div class="stat"><dt>Wave</dt><dd id="wave"></dd></div>
          <div class="stat"><dt>Energy</dt><dd id="energy"></dd></div>
          <div class="stat"><dt>Gold</dt><dd id="gold" class="gold"></dd></div>
          <div class="stat"><dt>White cells</dt><dd id="cells"></dd></div>
          <div class="stat"><dt>Immune pulse</dt><dd id="pulseStat"></dd></div>
        </dl>
        <div class="hud-buttons">
          <button id="btnMenu" type="button">Menu</button>
          <button id="btnPause" type="button" title="Pause (P)">Pause</button>
          <button id="btnSpeed" type="button">Speed ×1</button>
          <button id="btnSound" type="button" title="Sound on or off (M)">Sound</button>
          <button id="btnRestart" type="button" class="danger">Restart</button>
        </div>
      </header>
      <main id="layout">
        <section id="field" aria-label="The organ and its vessels">
          <div id="mapScroll">
            <canvas id="board" aria-label="Map: the organ in the centre with vessels approaching it; sites beside each vessel for lymph nodes."></canvas>
            <div id="popover" class="popover" hidden></div>
            <div id="inspect" class="popover inspect" hidden role="dialog" aria-label="Pathogen details"></div>
            <div id="coach" hidden role="status" aria-live="polite"></div>
          </div>
          <button id="btnZoom" type="button" aria-pressed="false" title="Zoom the map in: swipe to move around it">Zoom</button>
          <div id="overlay" hidden></div>
          <div id="menu" hidden role="dialog" aria-label="Menu"></div>
        </section>
        <div id="notices"><div id="bossBar" hidden role="status"></div><div id="toast" hidden role="status" aria-live="polite"></div><div id="tip" hidden role="status" aria-live="polite"></div></div>
        <aside id="panel" aria-label="Controls"></aside>
      </main>
      <div id="info" hidden><div class="drawer" role="dialog" aria-label="Info"><button id="infoClose" class="x" type="button" aria-label="Close info">×</button><div id="infoBody"></div></div></div>
      <div id="rotate" role="alert"><div class="plate"><p class="kicker">Defend the Heart</p><h2>Turn your phone sideways</h2><p>The game is played in landscape.</p><button id="btnLandscape" type="button" class="primary" hidden>Play full screen</button></div></div>
      <footer id="foot">An anatomy tower defence · <a href="https://github.com/BrendanJvR-ux/defend-the-heart">source</a></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
